<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PHOTO BOOTH — Processing</title>
    <link rel="stylesheet" href="shared.css">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MEMORIES">
    <meta name="theme-color" content="#0A0A0A">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="manifest" href="/manifest.json">
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen overflow-hidden flex flex-col items-center justify-center relative">
    
    <div class="flex flex-col items-center justify-center z-10 fade-up-enter">
        <div class="relative w-24 h-24 mb-8">
            <!-- Outer spinning ring -->
            <div class="absolute inset-0 border-4 border-gray-200 rounded-full"></div>
            <div class="absolute inset-0 border-4 border-gray-900 rounded-full border-t-transparent animate-spin"></div>
            <!-- Inner pulse -->
            <div class="absolute inset-4 bg-gray-900 rounded-full opacity-10 animate-ping"></div>
        </div>
        
        <h2 class="text-2xl font-bold tracking-tight mb-2" data-i18n="proc_title">Processing Photos</h2>
        <p id="status-text" class="text-gray-500 text-sm font-medium" data-i18n="proc_desc">Applying high-quality filters...</p>
    </div>

    <!-- Hidden canvas for processing -->
    <canvas id="work-canvas" class="hidden"></canvas>

    <script src="template-engine.js?v=1.0"></script>
    <script src="shared.js?v=2.9"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const statusText = document.getElementById('status-text');
            const wait = (ms) => new Promise(r => setTimeout(r, ms));
            
            try {
                let photos = (await SessionAsync.get('raw_photos')) || Session.photos || [];
                if (!photos || photos.length === 0) {
                    console.error("No photos found in session!");
                    statusText.innerText = "No photos found. Returning to start...";
                    await wait(800);
                    window.location.href = 'home.html';
                    return;
                }

                const template = Session.template || 'light';
                const currentLayoutStr = Session.layout || '4_1x1';
                const selectedFilter = Session.filter || 'original';
                const layoutSize = await fetchLayoutSizeFor(currentLayoutStr);
                
                // Fetch Custom Theme (if UUID)
                let customThemeObj = null;
                if (!['light', 'dark', 'mint', 'blue', 'exhibition'].includes(template)) {
                    customThemeObj = await fetchCustomThemeById(template);
                }

                // 0. Apply filter to photos (if not original)
                if (selectedFilter && selectedFilter !== 'original') {
                    statusText.innerText = "Applying filter...";
                    await wait(40);
                    photos = await applyPhotosFilter(photos, selectedFilter);
                }
                
                // 1. Compose full res (1200px width for printing)
                statusText.innerText = "Composing layout...";
                await wait(40); // let the status update paint before CPU work
                const renderStartedAt = performance.now();
                const colorCanvas = await composePhotoByMode(photos, template, 1200, customThemeObj, currentLayoutStr, layoutSize);
                await SessionAsync.set('result', colorCanvas.toDataURL('image/jpeg', 0.9));
                const renderDurationMs = Math.round(performance.now() - renderStartedAt);
                Session.renderMetrics = {
                    durationMs: renderDurationMs,
                    width: colorCanvas.width,
                    height: colorCanvas.height,
                    templateSchemaId: Session.templateSchemaId || null,
                    renderedAt: new Date().toISOString()
                };

                // 2. Apply Dithering for the alternate version
                if (Kiosk.paperMode.startsWith('thermal')) {
                    statusText.innerText = "Generating Retro Dithered version...";
                    const workCanvas = document.getElementById('work-canvas');
                    workCanvas.width = colorCanvas.width;
                    workCanvas.height = colorCanvas.height;
                    const ctx = workCanvas.getContext('2d');
                    ctx.drawImage(colorCanvas, 0, 0);

                    const imageData = ctx.getImageData(0, 0, workCanvas.width, workCanvas.height);
                    const ditheredData = await ditherImageData(imageData);
                    ctx.putImageData(ditheredData, 0, 0);
                    await SessionAsync.set('dithered', workCanvas.toDataURL('image/png'));
                } else {
                    await SessionAsync.remove('dithered');
                }

                // Raw captures are transient composition inputs only. Keep the
                // final color and dithered assets, then remove every raw frame.
                await SessionAsync.remove('raw_photos');
                await SessionAsync.remove('photos');
                photos = [];

                // 3. Finalize
                statusText.innerText = "Finalizing...";
                await wait(80);

                window.location.href = 'print.html';

            } catch (err) {
                console.error("Processing error:", err);
                statusText.innerText = "Error processing. Returning to start...";
                await wait(1000);
                window.location.href = 'home.html';
            }
        });
    </script>
</body>
</html>
