<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PHOTO BOOTH — Review Photos</title>
    <link rel="stylesheet" href="shared.css">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MEMORIES">
    <meta name="theme-color" content="#0A0A0A">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="manifest" href="/manifest.json">
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen overflow-y-auto no-scrollbar relative flex flex-col">
    
    <!-- Header -->
    <header class="kiosk-header">
        <button onclick="window.location.href='capture.html'" class="flex items-center gap-2 text-gray-500 hover:text-gray-900 transition-colors">
            <span class="material-symbols-outlined">arrow_back</span>
            <span class="font-medium text-sm tracking-wide" data-i18n="btn_back">BACK</span>
        </button>
        <div class="kiosk-brand tracking-widest text-sm" data-i18n="brand">MEMORIES</div>
        <div class="w-20"></div>
    </header>

    <main class="flex-grow pt-20 pb-32 px-4 sm:px-8 max-w-6xl mx-auto w-full flex flex-col relative z-10 fade-up-enter">
        <div class="text-center mb-6">
            <h1 class="text-2xl md:text-4xl font-bold tracking-tight mb-1 uppercase">Review Photos</h1>
            <p class="text-gray-500 text-xs md:text-sm">Retake any photo you don't like before continuing.</p>
        </div>

        <!-- Grid of photos -->
        <!-- Centered both ways in the space between the title and the Continue bar -->
        <div id="photo-grid" class="flex-grow flex flex-wrap justify-center content-center items-center gap-3 sm:gap-4 w-full">
            <!-- Injected by JS -->
        </div>
    </main>

    <!-- Bottom Bar -->
    <div class="fixed bottom-0 left-0 w-full p-8 bg-gradient-to-t from-gray-50 via-gray-50/90 to-transparent z-40 flex justify-center">
        <button id="btn-continue" onclick="saveSelectionAndContinue()" class="btn-modern btn-primary text-base px-16 py-4 w-full max-w-sm group transition-all shadow-xl hover:-translate-y-1">
            Continue 
            <span class="material-symbols-outlined ml-2 text-sm group-hover:translate-x-1 transition-transform">east</span>
        </button>
    </div>

    <script src="template-engine.js?v=2.3"></script>
    <script src="shared.js?v=3.4"></script>
    <script>
        let requiredCount = 4;
        let rawPhotos = [];

        document.addEventListener('DOMContentLoaded', async () => {
            const layoutStr = Session.layout || '4';
            requiredCount = TemplateCatalog.requiredShots(layoutStr);

            rawPhotos = (await SessionAsync.get('raw_photos')) || Session.photos || [];
            if (!rawPhotos || rawPhotos.length === 0) {
                // If no photos, go back to capture
                window.location.href = 'capture.html';
                return;
            }

            renderGrid();
            window.addEventListener('resize', fitGrid);
            new IdleTimer(120000, 'home.html').start();
        });

        function renderGrid() {
            const grid = document.getElementById('photo-grid');
            grid.innerHTML = '';
            const retakeLabel = getLanguage() === 'en' ? 'Retake' : 'ถ่ายใหม่';

            const slot = reviewSlot();
            rawPhotos.forEach((src, idx) => {
                // One column per photo: the picture, then an always-visible Retake button.
                const item = document.createElement('div');
                item.className = 'review-item shrink-0 flex flex-col gap-3';

                const frame = document.createElement('div');
                frame.className = 'relative bg-gray-200 rounded-xl overflow-hidden shadow-sm';
                frame.style.aspectRatio = String(slot.aspect);

                const img = document.createElement('img');
                img.src = src;
                img.className = 'w-full h-full object-cover';
                img.style.objectPosition = (slot.fx * 100) + '% ' + (slot.fy * 100) + '%';   // same anchor as the print crop
                img.id = `img-${idx}`;
                img.alt = '';

                // Number badge
                const badge = document.createElement('div');
                badge.className = 'absolute top-3 left-3 w-8 h-8 rounded-full bg-black/60 text-white font-bold flex items-center justify-center text-sm shadow-md backdrop-blur-md';
                badge.innerText = idx + 1;

                frame.appendChild(img);
                frame.appendChild(badge);

                const retakeBtn = document.createElement('button');
                retakeBtn.type = 'button';
                retakeBtn.className = 'btn-modern bg-white text-gray-900 border-2 border-gray-900 w-full py-3 text-base font-bold flex items-center justify-center gap-2 shadow-md hover:bg-gray-900 hover:text-white active:scale-95 transition-all';
                retakeBtn.innerHTML = '<span class="material-symbols-outlined text-xl">autorenew</span><span></span>';
                retakeBtn.lastElementChild.textContent = retakeLabel + ' ' + (idx + 1);
                retakeBtn.setAttribute('aria-label', retakeLabel + ' ' + (idx + 1));
                retakeBtn.onclick = () => {
                    window.location.href = `capture.html?retake=${idx}`;
                };

                item.appendChild(frame);
                item.appendChild(retakeBtn);
                grid.appendChild(item);
            });
            fitGrid();
        }

        // Shape of the photo in the frame picked before shooting, so the review shows what will be printed.
        function reviewSlot() {
            const t = Session.templateSchemaId && TemplateCatalog.find(Session.templateSchemaId);
            const s = t && t.slots && t.slots.find((x) => x.width > 0 && x.height > 0);
            return s ? { aspect: s.width / s.height, fx: s.focusX ?? 0.5, fy: s.focusY ?? 0.42 } : { aspect: 3 / 4, fx: 0.5, fy: 0.42 };
        }

        // As big as the free space allows: try every column count and keep the one with the widest photos.
        function fitGrid() {
            const grid = document.getElementById('photo-grid');
            const items = [...grid.children];
            if (!items.length) return;
            const aspect = reviewSlot().aspect;
            const gap = parseFloat(getComputedStyle(grid).columnGap) || 16;
            const bar = document.getElementById('btn-continue').parentElement.offsetHeight;
            const W = grid.clientWidth, H = Math.max(200, window.innerHeight - grid.getBoundingClientRect().top - bar - 16);   // space above the Continue bar
            const below = 64;                                 // retake button + its gap
            let best = 120;
            for (let cols = 1; cols <= items.length; cols++) {
                const rows = Math.ceil(items.length / cols);
                const byW = (W - gap * (cols - 1)) / cols;
                const byH = ((H - gap * (rows - 1)) / rows - below) * aspect;
                best = Math.max(best, Math.min(byW, byH));
            }
            const w = Math.floor(Math.min(best, 640));
            items.forEach((el) => { el.style.width = w + 'px'; });
        }

        function saveSelectionAndContinue() {
            // In retake flow, all photos shown are the final photos
            Session.photos = rawPhotos;
            SessionAsync.set('raw_photos', rawPhotos).then(() => {
                // The frame was picked before shooting: go straight on to the filter or processing.
                if (!Kiosk.filterEnabled) Session.filter = 'original';
                window.location.href = Kiosk.filterEnabled ? 'filter.html' : 'processing.html';
            });
        }
    </script>
</body>
</html>
