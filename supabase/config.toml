
[functions.redeem-claim]
enabled = true
verify_jwt = false
import_map = "./functions/redeem-claim/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/redeem-claim/index.ts"

[functions.redeem-pass]
enabled = true
verify_jwt = false
import_map = "./functions/redeem-pass/deno.json"
entrypoint = "./functions/redeem-pass/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/redeem-claim/*.html" ]

