<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PHOTO BOOTH — Template</title>
    <link rel="stylesheet" href="shared.css">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MEMORIES">
    <meta name="theme-color" content="#0A0A0A">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="manifest" href="/manifest.json">
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen overflow-y-auto no-scrollbar relative flex flex-col">
    
    <!-- Header -->
    <header class="kiosk-header">
        <div class="kiosk-brand tracking-widest text-sm" data-i18n="brand">MEMORIES</div>
    </header>

    <main class="flex-grow pt-20 pb-28 px-4 sm:px-6 lg:px-12 flex flex-col lg:flex-row gap-6 lg:gap-12 max-w-7xl mx-auto w-full fade-up-enter">
        
        <!-- Live Preview Side -->
        <div class="w-full lg:w-1/2 flex flex-col items-center justify-center bg-gray-100 rounded-2xl md:rounded-3xl p-4 md:p-6 lg:p-8 relative overflow-hidden min-h-[40vh] lg:min-h-[65vh] shrink-0">
            <!-- Background element for contrast -->
            <div class="absolute inset-0 bg-white/50 pointer-events-none"></div>
            


            <div id="preview-container" class="relative z-10 shadow-2xl transition-transform duration-500 hover:scale-[1.02] w-full h-full flex items-center justify-center">
                <!-- Canvas will be injected here -->
            </div>
        </div>

        <!-- Selection Side -->
        <div class="w-full lg:w-1/2 flex flex-col justify-start lg:justify-center">
            <h1 class="text-2xl md:text-3xl lg:text-4xl font-bold tracking-tight mb-1 md:mb-2 shrink-0" data-i18n="tpl_title">Choose Frame</h1>
            <p class="text-gray-500 text-xs md:text-sm mb-4 lg:mb-8 shrink-0" data-i18n="tpl_desc">Select a frame style that matches your mood.</p>

            <div class="grid grid-cols-2 gap-3 lg:gap-4 pb-8 items-start">
                
                <div class="selection-card selected p-6 text-center" data-template="light">
                    <div class="w-16 h-16 rounded-full border border-gray-200 mx-auto mb-4 bg-white shadow-sm flex items-center justify-center">
                        <div class="w-8 h-8 border border-gray-900 bg-white"></div>
                    </div>
                    <h3 class="font-semibold text-gray-900" data-i18n="tpl_light">Classic Y2K</h3>
                    <p class="text-[10px] text-gray-500 uppercase tracking-widest" data-i18n="tpl_light_sub">Minimalist Monochrome</p>
                </div>

                <div class="selection-card p-6 text-center" data-template="dark">
                    <div class="w-16 h-16 rounded-full mx-auto mb-4 bg-gray-900 flex flex-col items-center justify-center gap-1">
                        <!-- Retro ticket lines -->
                        <div class="w-8 border-b-2 border-white border-dashed"></div>
                        <div class="text-white text-[8px] tracking-widest font-bold">TICKET</div>
                    </div>
                    <h3 class="font-semibold text-gray-900" data-i18n="tpl_dark">Retro Ticket</h3>
                    <p class="text-[10px] text-gray-500 uppercase tracking-widest" data-i18n="tpl_dark_sub">Receipt Style</p>
                </div>

                <div class="selection-card p-6 text-center" data-template="mint">
                    <div class="w-16 h-16 rounded-full mx-auto mb-4 bg-gray-100 border border-gray-200 flex flex-col items-center justify-center">
                        <!-- Mac OS dots -->
                        <div class="flex gap-1 mb-2 bg-gray-200 w-10 px-1 py-1 rounded-full">
                            <div class="w-2 h-2 rounded-full bg-red-400"></div>
                            <div class="w-2 h-2 rounded-full bg-yellow-400"></div>
                            <div class="w-2 h-2 rounded-full bg-green-400"></div>
                        </div>
                    </div>
                    <h3 class="font-semibold text-gray-900" data-i18n="tpl_mint">Web Browser</h3>
                    <p class="text-[10px] text-gray-500 uppercase tracking-widest" data-i18n="tpl_mint_sub">Mac OS Window</p>
                </div>

                <div class="selection-card p-6 text-center" data-template="blue">
                    <div class="w-16 h-16 rounded-full mx-auto mb-4 bg-gray-900 flex items-center justify-center">
                        <!-- Play button -->
                        <span class="material-symbols-outlined text-white text-3xl">play_circle</span>
                    </div>
                    <h3 class="font-semibold text-gray-900" data-i18n="tpl_blue">Music Player</h3>
                    <p class="text-[10px] text-gray-500 uppercase tracking-widest" data-i18n="tpl_blue_sub">Retro MP3</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Bar -->
    <div class="fixed bottom-0 left-0 w-full p-8 bg-gradient-to-t from-gray-50 via-gray-50/90 to-transparent z-40 flex justify-center">
        <button onclick="saveAndContinue()" class="btn-modern btn-primary text-base px-16 py-4 w-full max-w-sm group" data-i18n="btn_process">
            Process Photos
            <span class="material-symbols-outlined ml-2 text-sm group-hover:rotate-180 transition-transform duration-500">sync</span>
        </button>
    </div>

    <script src="template-engine.js?v=1.0"></script>
    <script src="shared.js?v=2.9"></script>
    <script>
        let globalPhotos = [];

        document.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('preview-container');
            const gridContainer = document.querySelector('.grid.grid-cols-2');
            
            globalPhotos = (await SessionAsync.get('raw_photos')) || Session.photos || [];

            const paperMode = Kiosk.paperMode || 'photo4x6_dual';
            const currentLayoutStr = Session.layout || '3_1x1';
            const currentLayoutSize = await fetchLayoutSizeFor(currentLayoutStr);
            const currentReqShots = window.PhotoTemplateEngine ? PhotoTemplateEngine.parseLayout(currentLayoutStr).count : 3;

            // Load Custom Themes (Legacy Supabase)
            const customThemes = await fetchCustomThemes();
            customThemes.forEach(t => {
                const icon = t.theme_type === 'png' ? 'image' : 'match_case';
                
                const cardDiv = document.createElement('div');
                cardDiv.className = 'selection-card p-6 text-center';
                cardDiv.dataset.template = t.id;
                cardDiv.dataset.custom = "true";
                cardDiv.innerHTML = `
                        <div class="w-16 h-16 rounded-full mx-auto mb-4 bg-gray-900 flex items-center justify-center">
                            <span class="material-symbols-outlined text-accent-mint text-3xl">${icon}</span>
                        </div>
                        <h3 class="font-semibold text-gray-900 line-clamp-1">${escapeHtml(t.name)}</h3>
                        <p class="text-[10px] text-gray-500 uppercase tracking-widest">Custom Theme</p>
                `;
                gridContainer.appendChild(cardDiv);
            });

            // Load Custom Templates from Template Catalog (Created in Template Editor)
            const catalog = TemplateCatalog.load();
            const targetType = (typeof Kiosk !== 'undefined' && typeof Kiosk.getTargetTemplateType === 'function')
                ? Kiosk.getTargetTemplateType(paperMode)
                : (paperMode === 'photo4x6_postcard' ? '4x6' : (paperMode.startsWith('thermal') ? paperMode : '2x6'));

            const customTemplates = catalog.filter(t => {
                if (t.enabled === false) return false;
                
                // Must match active paper format
                let typeMatches = false;
                if (targetType === '2x6') typeMatches = t.type === '2x6';
                else if (targetType === '4x6') typeMatches = t.type === '4x6';
                else if (targetType.startsWith('thermal')) typeMatches = (t.type && t.type.startsWith('thermal'));
                else if (targetType === 'photo5x7') typeMatches = t.type === 'photo5x7';
                if (!typeMatches) return false;

                // Include custom templates created by user or having custom artboard/overlay
                const isCustom = t.templateId.startsWith('custom_') || (t.artboard && t.artboard.length > 0) || (t.overlay && t.overlay.url);
                const matchesShots = !t.slots || t.slots.length === currentReqShots || (globalPhotos.length > 0 && t.slots.length === globalPhotos.length);
                return isCustom && matchesShots;
            });

            customTemplates.forEach(tpl => {
                const cardDiv = document.createElement('div');
                cardDiv.className = 'selection-card p-6 text-center';
                cardDiv.dataset.schemaId = tpl.templateId;
                cardDiv.dataset.isSchema = "true";
                
                let thumbHtml = '';
                if (tpl.overlay && tpl.overlay.url) {
                    thumbHtml = `<img src="${tpl.overlay.url}" class="w-full h-full object-contain p-1" alt="">`;
                } else if (tpl.artboard && tpl.artboard.length > 0 && tpl.artboard[0].url) {
                    thumbHtml = `<img src="${tpl.artboard[0].url}" class="w-full h-full object-contain p-1" alt="">`;
                } else if (tpl.canvas && tpl.canvas.backgroundImage) {
                    thumbHtml = `<img src="${tpl.canvas.backgroundImage}" class="w-full h-full object-cover" alt="">`;
                } else {
                    thumbHtml = `<span class="material-symbols-outlined text-white text-3xl">palette</span>`;
                }

                const bgColor = (tpl.canvas && tpl.canvas.backgroundColor) ? tpl.canvas.backgroundColor : '#0A0A0A';
                
                cardDiv.innerHTML = `
                    <div class="w-16 h-16 rounded-full mx-auto mb-4 border border-gray-200 shadow-sm flex items-center justify-center overflow-hidden" style="background-color: ${bgColor};">
                        ${thumbHtml}
                    </div>
                    <h3 class="font-semibold text-gray-900 line-clamp-1">${escapeHtml(tpl.name)}</h3>
                    <p class="text-[10px] text-accent-blue uppercase tracking-widest font-bold">Custom Template</p>
                `;
                gridContainer.appendChild(cardDiv);
            });

            async function updatePreview(templateId, isCustom, schemaId) {
                container.innerHTML = '<div class="spinner border-gray-300 mx-auto"></div>';
                let canvas;
                if (schemaId) {
                    const tpl = TemplateCatalog.find(schemaId);
                    if (tpl) {
                        canvas = await composeTemplateBySchema(globalPhotos, 'custom_schema', 460, null, tpl, paperMode);
                    }
                }
                if (!canvas) {
                    let themeObj = null;
                    if (isCustom) {
                        themeObj = customThemes.find(t => t.id === templateId);
                    }
                    canvas = await composePhotoByMode(globalPhotos, templateId, 460, themeObj, currentLayoutStr, currentLayoutSize);
                }
                canvas.className = 'rounded-md shadow-2xl max-w-full max-h-[50vh] lg:max-h-[62vh] object-contain transition-all duration-300';
                container.innerHTML = '';
                container.appendChild(canvas);
            }

            // Init selection state
            if (Session.templateSchemaId && TemplateCatalog.find(Session.templateSchemaId)) {
                updatePreview(null, false, Session.templateSchemaId);
            } else {
                Session.template = Session.template || 'light';
                updatePreview(Session.template, false, null);
            }

            // Selectors
            const setupCards = () => {
                const cards = document.querySelectorAll('.selection-card');
                cards.forEach(card => {
                    if (Session.templateSchemaId && card.dataset.schemaId === Session.templateSchemaId) {
                        card.classList.add('selected');
                    } else if (!Session.templateSchemaId && card.dataset.template === Session.template) {
                        card.classList.add('selected');
                    } else {
                        card.classList.remove('selected');
                    }
                    card.addEventListener('click', () => {
                        cards.forEach(c => c.classList.remove('selected'));
                        card.classList.add('selected');
                        if (card.dataset.isSchema === 'true') {
                            Session.templateSchemaId = card.dataset.schemaId;
                            Session.template = 'custom_schema';
                            SessionAsync.set('templateSchemaId', card.dataset.schemaId);
                            SessionAsync.set('template', 'custom_schema');
                            updatePreview(null, false, card.dataset.schemaId);
                        } else {
                            Session.templateSchemaId = null;
                            Session.template = card.dataset.template;
                            SessionAsync.set('templateSchemaId', null);
                            SessionAsync.set('template', card.dataset.template);
                            updatePreview(card.dataset.template, card.dataset.custom === 'true', null);
                        }
                    });
                });
            };
            setupCards();

            new IdleTimer(120000, 'home.html').start(); // 2 mins idle
        });

        function escapeHtml(value) {
            const div = document.createElement('div');
            div.textContent = value || '';
            return div.innerHTML;
        }

        function saveAndContinue() {
            const nextPage = Kiosk.filterEnabled ? 'filter.html' : 'processing.html';
            if (!Kiosk.filterEnabled) {
                Session.filter = 'original';
            }
            if (globalPhotos && globalPhotos.length > 0) {
                Session.photos = globalPhotos;
                SessionAsync.set('raw_photos', globalPhotos).then(() => {
                    if (Session.templateSchemaId) SessionAsync.set('templateSchemaId', Session.templateSchemaId);
                    if (Session.template) SessionAsync.set('template', Session.template);
                    window.location.href = nextPage;
                });
            } else {
                if (Session.templateSchemaId) SessionAsync.set('templateSchemaId', Session.templateSchemaId);
                if (Session.template) SessionAsync.set('template', Session.template);
                window.location.href = nextPage;
            }
        }
    </script>
</body>
</html>
