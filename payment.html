<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PHOTO BOOTH — Redeem Code</title>
    <link rel="stylesheet" href="shared.css">
    <style>
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-6px); }
            20%, 40%, 60%, 80% { transform: translateX(6px); }
        }
        .shake {
            animation: shake 0.5s ease-in-out;
        }
        .code-input {
            font-family: 'Inter', monospace;
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: 0.3em;
            text-align: center;
            text-transform: uppercase;
            caret-color: #4C65FF;
            background: transparent;
            border: none;
            outline: none;
            width: 100%;
            color: #0A0A0A;
        }
        .code-input::placeholder {
            color: #D0D0D0;
            letter-spacing: 0.3em;
        }
        .code-box {
            border: 2px solid #E3E3E3;
            border-radius: 20px;
            padding: 1.5rem 2rem;
            transition: border-color 0.3s, box-shadow 0.3s;
            background: white;
        }
        .code-box:focus-within {
            border-color: #4C65FF;
            box-shadow: 0 0 0 4px rgba(76, 101, 255, 0.1);
        }
        .code-box.error {
            border-color: #FF6B57;
            box-shadow: 0 0 0 4px rgba(255, 107, 87, 0.1);
        }
        .code-box.success {
            border-color: #BAFF66;
            box-shadow: 0 0 0 4px rgba(186, 255, 102, 0.2);
        }
    </style>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MEMORIES">
    <meta name="theme-color" content="#0A0A0A">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="manifest" href="/manifest.json">
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen overflow-y-auto relative flex flex-col">
    
    <!-- Background Gradients -->
    <div class="absolute inset-0 bg-gradient-starter opacity-50 pointer-events-none"></div>

    <!-- Header -->
    <header class="kiosk-header">
        <button onclick="window.location.href='home.html'" class="flex items-center gap-2 text-gray-500 hover:text-gray-900 transition-colors">
            <span class="material-symbols-outlined">arrow_back</span>
            <span class="font-medium text-sm tracking-wide" data-i18n="btn_cancel">CANCEL</span>
        </button>
        <div class="kiosk-brand tracking-widest text-sm" data-i18n="brand">MEMORIES</div>
        <div class="w-20"></div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center relative z-10 px-4 py-20 sm:py-24">
        <div class="glass-panel w-full max-w-lg p-6 sm:p-10 flex flex-col items-center fade-up-enter">
            
            <!-- Icon -->
            <div class="w-16 h-16 bg-gray-900 rounded-2xl flex items-center justify-center mb-6 shadow-lg">
                <span class="material-symbols-outlined text-white text-3xl">confirmation_number</span>
            </div>

            <h1 class="text-2xl font-bold tracking-tight mb-2" id="redeem-title">กรอกรหัส Redeem</h1>
            <p class="text-gray-500 text-sm mb-8 text-center" id="redeem-desc">กรอกรหัส 6 หลักที่ได้รับจากพนักงาน</p>
            
            <!-- Code Input -->
            <div id="code-box" class="code-box w-full mb-4">
                <input 
                    type="text" 
                    id="code-input" 
                    class="code-input" 
                    placeholder="K7M2X"
                    maxlength="5"
                    autocomplete="off"
                    autocapitalize="characters"
                    spellcheck="false"
                >
            </div>

            <!-- Error Message -->
            <div id="error-msg" class="text-accent-coral text-sm font-medium mb-6 h-6 flex items-center gap-1 opacity-0 transition-opacity">
                <span class="material-symbols-outlined text-base">error</span>
                <span id="error-text"></span>
            </div>

            <!-- Redeem Button -->
            <button id="redeem-btn" onclick="handleRedeem()" class="btn-modern bg-gray-300 text-gray-500 cursor-not-allowed w-full text-lg py-5" disabled>
                ใช้รหัส (Redeem)
                <span class="material-symbols-outlined ml-2">east</span>
            </button>
            <div id="pass-ready" class="hidden mt-5 text-center" aria-live="polite">
                <p id="pass-summary" class="text-xl font-bold text-gray-900 mb-4"></p>
                <button type="button" onclick="window.location.href='layout.html'" class="btn-modern btn-primary w-full text-lg py-5">เริ่มถ่าย →</button>
            </div>

            <!-- Loading state -->
            <div id="loading" class="hidden flex items-center gap-3 mt-6">
                <div class="spinner"></div>
                <span class="text-gray-500 text-sm font-medium">กำลังตรวจสอบรหัส...</span>
            </div>

            <!-- PromptPay purchase (shown only when enabled in admin) -->
            <a id="buy-link" href="buy.html" class="hidden mt-6 flex items-center gap-2 text-sm text-gray-500 hover:text-gray-900 underline underline-offset-4">
                <span class="material-symbols-outlined text-base">qr_code_2</span>
                ยังไม่มีรหัส? ซื้อแพ็กเกจด้วย PromptPay
            </a>
        </div>
    </main>

    <!-- Flash Overlay -->
    <div id="flash-overlay" class="flash-overlay"></div>

    <script src="shared.js?v=3.3"></script>
    <script>
        const errorMessages = {
            en: {
                invalid_format: 'Enter the 5-character code on your card.',
                not_found: 'Invalid code. Please check and try again.',
                already_used: 'This code has already been used.',
                expired: 'This code has expired. Please get a new code.',
                wrong_kiosk: 'This code belongs to another booth or package.',
                network_error: 'Connection error. Please try again.',
                already_in_use: 'This card is currently in use.',
                quota_exhausted: 'All print credits have been used.',
                device_not_provisioned: 'This booth is not ready to accept packages.',
                code_unavailable: 'This card has expired or has no print credits left.',
                kiosk_in_use: 'This booth is finishing another card. Please wait.',
                too_many_attempts: 'Too many attempts. Please wait and try again.',
            },
            th: {
                invalid_format: 'กรอกรหัส 5 ตัวบนบัตร เช่น K7M2X',
                not_found: 'รหัสไม่ถูกต้อง กรุณาตรวจสอบและลองใหม่',
                already_used: 'รหัสนี้ถูกใช้ไปแล้ว กรุณาซื้อรหัสใหม่',
                expired: 'รหัสหมดอายุแล้ว กรุณาซื้อรหัสใหม่',
                network_error: 'เกิดข้อผิดพลาดในการเชื่อมต่อ กรุณาลองใหม่',
                already_in_use: 'บัตรนี้กำลังใช้งานอยู่',
                quota_exhausted: 'ใช้สิทธิ์พิมพ์ครบแล้ว',
                device_not_provisioned: 'ตู้นี้ยังไม่พร้อมรับแพ็กเกจ กรุณาเรียกพนักงาน',
                code_unavailable: 'บัตรหมดอายุหรือใช้สิทธิ์พิมพ์ครบแล้ว',
                kiosk_in_use: 'ตู้นี้กำลังใช้งานบัตรอื่น กรุณารอสักครู่',
                too_many_attempts: 'ลองรหัสผิดหลายครั้ง กรุณารอสักครู่แล้วลองใหม่',
            }
        };

        const titleText = { en: 'Enter Redeem Code', th: 'กรอกรหัส Redeem' };
        const descText = { en: 'Enter the 5-character code on your card', th: 'กรอกรหัส 5 ตัวบนบัตร' };
        const btnText = { en: 'Redeem', th: 'ใช้รหัส (Redeem)' };

        document.addEventListener('DOMContentLoaded', () => {
            // Event mode skip
            const demoMode = isLocalPrototypeDemo();
            if (Kiosk.mode === 'event' && !demoMode) {
                window.location.replace('layout.html');
                return;
            }

            new IdleTimer(60000, 'home.html').start();
            document.getElementById('buy-link').classList.toggle('hidden', !Kiosk.promptPayEnabled);

            const input = document.getElementById('code-input');
            const btn = document.getElementById('redeem-btn');
            
            // Apply language
            const lang = getLanguage();
            document.getElementById('redeem-title').innerText = titleText[lang] || titleText.th;
            document.getElementById('redeem-desc').innerText = descText[lang] || descText.th;
            btn.innerHTML = (btnText[lang] || btnText.th) + ' <span class="material-symbols-outlined ml-2">east</span>';
            
            // Short codes are checked by the server; the browser only helps with entry.
            input.addEventListener('input', (e) => {
                e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
                clearError();
                
                if (PRINT_PASS_CODE.test(e.target.value)) {
                    btn.disabled = false;
                    btn.className = 'btn-modern btn-primary w-full text-lg py-5 shadow-xl hover:-translate-y-1 transition-all';
                } else {
                    btn.disabled = true;
                    btn.className = 'btn-modern bg-gray-300 text-gray-500 cursor-not-allowed w-full text-lg py-5';
                }
            });

            // Enter key to submit
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && PRINT_PASS_CODE.test(input.value)) {
                    handleRedeem();
                }
            });
            
            // Auto focus
            setTimeout(() => input.focus(), 300);
        });

        function showError(errorKey) {
            const lang = getLanguage();
            const messages = errorMessages[lang] || errorMessages.th;
            const errorMsg = document.getElementById('error-msg');
            const errorText = document.getElementById('error-text');
            const codeBox = document.getElementById('code-box');
            
            errorText.innerText = messages[errorKey] || messages.not_found;
            errorMsg.classList.remove('opacity-0');
            errorMsg.classList.add('opacity-100');
            
            codeBox.classList.add('error', 'shake');
            setTimeout(() => codeBox.classList.remove('shake'), 500);
        }

        function clearError() {
            const errorMsg = document.getElementById('error-msg');
            const codeBox = document.getElementById('code-box');
            errorMsg.classList.remove('opacity-100');
            errorMsg.classList.add('opacity-0');
            codeBox.classList.remove('error');
        }

        let isProcessing = false;

        async function handleRedeem() {
            if (isProcessing) return;
            isProcessing = true;

            const input = document.getElementById('code-input');
            const btn = document.getElementById('redeem-btn');
            const loading = document.getElementById('loading');
            const codeBox = document.getElementById('code-box');
            const code = input.value.toUpperCase().trim();

            // Show loading
            btn.classList.add('hidden');
            loading.classList.remove('hidden');
            clearError();

            let result;
            try {
                result = await claimPrintPass(code);
            } catch (error) {
                console.error('Print pass claim failed:', error);
                result = { success: false, error: 'network_error' };
            }

            if (!result.success) {
                // Show error
                btn.classList.remove('hidden');
                loading.classList.add('hidden');
                showError(result.error);
                isProcessing = false;
                return;
            }

            // Success!
            codeBox.classList.add('success');
            loading.classList.add('hidden');
            triggerFlash();

            btn.classList.add('hidden');
            input.disabled = true;
            document.getElementById('pass-summary').textContent = printPassMessage(result.pass);
            document.getElementById('pass-ready').classList.remove('hidden');
        }
    </script>
</body>
</html>
