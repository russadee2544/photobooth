<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PHOTO BOOTH — Redeem Code</title>
    <link rel="stylesheet" href="shared.css">
    <style>
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-6px); }
            20%, 40%, 60%, 80% { transform: translateX(6px); }
        }
        .shake {
            animation: shake 0.5s ease-in-out;
        }
        .code-input {
            font-family: 'Inter', monospace;
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: 0.3em;
            text-align: center;
            text-transform: uppercase;
            caret-color: #4C65FF;
            background: transparent;
            border: none;
            outline: none;
            width: 100%;
            color: #0A0A0A;
        }
        .code-input::placeholder {
            color: #D0D0D0;
            letter-spacing: 0.3em;
        }
        /* Phones: 5 characters must fit the box (3rem with wide spacing ran past the edge) */
        @media (max-width: 480px) {
            .code-input, .code-input::placeholder { font-size: min(3rem, 10.5vw); letter-spacing: .18em; }
            .code-input { text-indent: .18em; }
            .code-box { padding: 1.2rem 1rem; }
        }
        .code-box {
            border: 2px solid #E3E3E3;
            border-radius: 20px;
            padding: 1.5rem 2rem;
            transition: border-color 0.3s, box-shadow 0.3s;
            background: white;
        }
        .code-box:focus-within {
            border-color: #4C65FF;
            box-shadow: 0 0 0 4px rgba(76, 101, 255, 0.1);
        }
        .code-box.error {
            border-color: #FF6B57;
            box-shadow: 0 0 0 4px rgba(255, 107, 87, 0.1);
        }
        /* On-screen keypad: digits plus the 6 letters new codes use (A C H K P X) */
        .keypad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: 100%;
            overflow: hidden; max-height: 0; opacity: 0; margin-top: 0;
            transition: max-height .28s ease, opacity .2s ease, margin-top .28s ease; }
        .keypad.open { max-height: 420px; opacity: 1; margin-top: 4px; margin-bottom: 12px; }
        .keypad button { height: 56px; border-radius: 14px; background: #F3F4F6; color: #0A0A0A;
            font: 700 1.45rem/1 'Inter', sans-serif; display: flex; align-items: center; justify-content: center;
            -webkit-tap-highlight-color: transparent; transition: background .1s, transform .08s; user-select: none; }
        .keypad button:active { background: #E0E3E8; transform: scale(.95); }
        .keypad button.letter { background: #E8ECFF; color: #3046D9; }
        .keypad button.fn { font-size: .85rem; font-weight: 600; color: #4B5563; }
        .keypad .wide { grid-column: span 2; }
        .keypad-more { display: none; }
        .keypad-more.open { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; width: 100%; margin-bottom: 12px; }
        .keypad-more button { height: 44px; border-radius: 10px; background: #F3F4F6; font: 700 1.05rem/1 'Inter', sans-serif; color: #374151; }
        .keypad-more button:active { background: #E0E3E8; }
        .code-box.success {
            border-color: #BAFF66;
            box-shadow: 0 0 0 4px rgba(186, 255, 102, 0.2);
        }
    </style>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MEMORIES">
    <meta name="theme-color" content="#0A0A0A">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="manifest" href="/manifest.json">
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen overflow-y-auto relative flex flex-col">
    
    <!-- Background Gradients -->
    <div class="absolute inset-0 bg-gradient-starter opacity-50 pointer-events-none"></div>

    <!-- Header -->
    <header class="kiosk-header">
        <button onclick="window.location.href='home.html'" class="flex items-center gap-2 text-gray-500 hover:text-gray-900 transition-colors">
            <span class="material-symbols-outlined">arrow_back</span>
            <span class="font-medium text-sm tracking-wide" data-i18n="btn_cancel">CANCEL</span>
        </button>
        <div class="kiosk-brand tracking-widest text-sm" data-i18n="brand">MEMORIES</div>
        <div class="w-20"></div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center relative z-10 px-4 py-20 sm:py-24">
        <div class="glass-panel w-full max-w-lg p-6 sm:p-10 flex flex-col items-center fade-up-enter">
            
            <!-- Icon -->
            <div id="redeem-icon" class="w-16 h-16 bg-gray-900 rounded-2xl flex items-center justify-center mb-6 shadow-lg">
                <span class="material-symbols-outlined text-white text-3xl">confirmation_number</span>
            </div>

            <h1 class="text-2xl font-bold tracking-tight mb-2" id="redeem-title">กรอกรหัส Redeem</h1>
            <p class="text-gray-500 text-sm mb-8 text-center" id="redeem-desc">กรอกรหัส 6 หลักที่ได้รับจากพนักงาน</p>
            
            <!-- Code Input -->
            <div id="code-box" class="code-box w-full mb-4">
                <input 
                    type="text" 
                    id="code-input" 
                    class="code-input" 
                    placeholder="27A49"
                    inputmode="none"
                    virtualkeyboardpolicy="manual"
                    maxlength="5"
                    autocomplete="off"
                    autocapitalize="characters"
                    spellcheck="false"
                >
            </div>

            <!-- On-screen keypad (the tablet's own keyboard stays closed) -->
            <div id="keypad" class="keypad" aria-label="Keypad"></div>
            <div id="keypad-more" class="keypad-more" aria-label="More letters"></div>

            <!-- Error Message -->
            <div id="error-msg" class="text-accent-coral text-sm font-medium mb-6 h-6 flex items-center gap-1 opacity-0 transition-opacity">
                <span class="material-symbols-outlined text-base">error</span>
                <span id="error-text"></span>
            </div>

            <!-- Redeem Button -->
            <button id="redeem-btn" onclick="handleRedeem()" class="btn-modern bg-gray-300 text-gray-500 cursor-not-allowed w-full text-lg py-5" disabled>
                ใช้รหัส (Redeem)
                <span class="material-symbols-outlined ml-2">east</span>
            </button>
            <div id="pass-ready" class="hidden mt-2 text-center" style="width:100%" aria-live="polite">
                <p id="pass-summary" class="text-xl font-bold text-gray-900 mb-4"></p>
                <button type="button" id="start-btn" onclick="window.location.href='layout.html'" class="btn-modern btn-primary text-xl py-6 shadow-xl" style="width:100%;font-weight:700">เริ่มถ่าย <span class="material-symbols-outlined">east</span></button>
            </div>

            <!-- Loading state -->
            <div id="loading" class="hidden flex items-center gap-3 mt-6">
                <div class="spinner"></div>
                <span class="text-gray-500 text-sm font-medium">กำลังตรวจสอบรหัส...</span>
            </div>

            <!-- PromptPay purchase (shown only when enabled in admin) -->
            <a id="buy-link" href="buy.html" class="hidden mt-6 flex items-center gap-2 text-sm text-gray-500 hover:text-gray-900 underline underline-offset-4">
                <span class="material-symbols-outlined text-base">qr_code_2</span>
                ยังไม่มีรหัส? ซื้อแพ็กเกจด้วย PromptPay
            </a>
        </div>
    </main>

    <!-- Flash Overlay -->
    <div id="flash-overlay" class="flash-overlay"></div>

    <script src="shared.js?v=3.4"></script>
    <script>
        const errorMessages = {
            en: {
                invalid_format: 'Enter the 5-character code on your card.',
                not_found: 'Invalid code. Please check and try again.',
                already_used: 'This code has already been used.',
                expired: 'This code has expired. Please get a new code.',
                wrong_kiosk: 'This code belongs to another booth or package.',
                network_error: 'Connection error. Please try again.',
                already_in_use: 'This card is currently in use.',
                quota_exhausted: 'All print credits have been used.',
                device_not_provisioned: 'This booth is not ready to accept packages.',
                code_unavailable: 'This card has expired or has no print credits left.',
                kiosk_in_use: 'This booth is finishing another card. Please wait.',
                too_many_attempts: 'Too many attempts. Please wait and try again.',
                invalid_code: 'Invalid code. Please check and try again.',
            },
            th: {
                invalid_format: 'กรอกรหัส 5 ตัวบนบัตร เช่น 27A49',
                not_found: 'รหัสไม่ถูกต้อง กรุณาตรวจสอบและลองใหม่',
                already_used: 'รหัสนี้ถูกใช้ไปแล้ว กรุณาซื้อรหัสใหม่',
                expired: 'รหัสหมดอายุแล้ว กรุณาซื้อรหัสใหม่',
                network_error: 'เกิดข้อผิดพลาดในการเชื่อมต่อ กรุณาลองใหม่',
                already_in_use: 'บัตรนี้กำลังใช้งานอยู่',
                quota_exhausted: 'ใช้สิทธิ์พิมพ์ครบแล้ว',
                device_not_provisioned: 'ตู้นี้ยังไม่พร้อมรับแพ็กเกจ กรุณาเรียกพนักงาน',
                code_unavailable: 'บัตรหมดอายุหรือใช้สิทธิ์พิมพ์ครบแล้ว',
                kiosk_in_use: 'ตู้นี้กำลังใช้งานบัตรอื่น กรุณารอสักครู่',
                too_many_attempts: 'ลองรหัสผิดหลายครั้ง กรุณารอสักครู่แล้วลองใหม่',
                invalid_code: 'รหัสไม่ถูกต้อง กรุณาตรวจสอบและลองใหม่',
            }
        };

        const titleText = { en: 'Enter Redeem Code', th: 'กรอกรหัส Redeem' };
        const descText = { en: 'Enter the 5-character code on your card', th: 'กรอกรหัส 5 ตัวบนบัตร' };
        const btnText = { en: 'Redeem', th: 'ใช้รหัส (Redeem)' };

        document.addEventListener('DOMContentLoaded', () => {
            // Event mode skip
            const demoMode = isLocalPrototypeDemo();
            if (Kiosk.mode === 'event' && !demoMode) {
                window.location.replace('layout.html');
                return;
            }

            new IdleTimer(60000, 'home.html').start();
            document.getElementById('buy-link').classList.toggle('hidden', !Kiosk.promptPayEnabled);

            const input = document.getElementById('code-input');
            const btn = document.getElementById('redeem-btn');
            
            // Apply language
            const lang = getLanguage();
            document.getElementById('redeem-title').innerText = titleText[lang] || titleText.th;
            document.getElementById('redeem-desc').innerText = descText[lang] || descText.th;
            btn.innerHTML = (btnText[lang] || btnText.th) + ' <span class="material-symbols-outlined ml-2">east</span>';
            
            // Short codes are checked by the server; the browser only helps with entry.
            input.addEventListener('input', (e) => {
                e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
                clearError();
                
                if (PRINT_PASS_CODE.test(e.target.value)) {
                    btn.disabled = false;
                    btn.className = 'btn-modern btn-primary w-full text-lg py-5 shadow-xl hover:-translate-y-1 transition-all';
                } else {
                    btn.disabled = true;
                    btn.className = 'btn-modern bg-gray-300 text-gray-500 cursor-not-allowed w-full text-lg py-5';
                }
            });

            // ---- on-screen keypad ----
            const keypad = document.getElementById('keypad');
            const keypadMore = document.getElementById('keypad-more');
            const icon = document.getElementById('redeem-icon');
            const setCode = (value) => {
                input.value = value.slice(0, 5);
                input.dispatchEvent(new Event('input'));
                // Code complete: fold the keypad away so the Redeem button is right there.
                if (input.value.length === 5) showKeypad(false);
            };
            const press = (key) => {
                if (input.disabled) return;
                if (key === 'back') setCode(input.value.slice(0, -1));
                else if (key === 'clear') setCode('');
                else if (key === 'more') keypadMore.classList.toggle('open');
                else setCode(input.value + key);
            };
            function showKeypad(open) {
                keypad.classList.toggle('open', open);
                if (!open) keypadMore.classList.remove('open');
                icon.classList.toggle('hidden', open);
            }
            const KEYS = ['1', '2', '3', 'A', 'C', '4', '5', '6', 'H', 'K', '7', '8', '9', 'P', 'X', 'clear', '0', 'back', 'more'];
            KEYS.forEach((key) => {
                const b = document.createElement('button');
                b.type = 'button';
                if (/^[A-Z]$/.test(key)) b.className = 'letter';
                if (key === 'clear') { b.className = 'fn'; b.textContent = lang === 'en' ? 'Clear' : 'ล้าง'; }
                else if (key === 'back') { b.className = 'fn wide'; b.innerHTML = '<span class="material-symbols-outlined">backspace</span>'; b.setAttribute('aria-label', 'Delete'); }
                else if (key === 'more') { b.className = 'fn'; b.textContent = 'ABC'; b.title = lang === 'en' ? 'Other letters (older cards)' : 'ตัวอักษรอื่น (บัตรรุ่นเก่า)'; }
                else b.textContent = key;
                b.addEventListener('pointerdown', (e) => { e.preventDefault(); press(key); });
                keypad.appendChild(b);
            });
            // Older cards can carry any letter of the old alphabet.
            'BDEFGJMNQRSTVWYZ'.split('').forEach((key) => {
                const b = document.createElement('button');
                b.type = 'button';
                b.textContent = key;
                b.addEventListener('pointerdown', (e) => { e.preventDefault(); press(key); });
                keypadMore.appendChild(b);
            });
            document.getElementById('code-box').addEventListener('pointerdown', () => { if (!input.disabled) showKeypad(true); });
            showKeypad(true);
            window.showKeypad = showKeypad;

            // Enter key to submit
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && PRINT_PASS_CODE.test(input.value)) {
                    handleRedeem();
                }
            });
            
            // Auto focus
            setTimeout(() => input.focus(), 300);
        });

        function showError(errorKey) {
            const lang = getLanguage();
            const messages = errorMessages[lang] || errorMessages.th;
            const errorMsg = document.getElementById('error-msg');
            const errorText = document.getElementById('error-text');
            const codeBox = document.getElementById('code-box');
            
            // Only a real "no such code" answer says the code is wrong; anything else shows its reason,
            // so a booth/connection fault is not mistaken for a mistyped code.
            errorText.innerText = messages[errorKey]
                || (lang === 'en' ? 'Could not check the code' : 'ตรวจรหัสไม่สำเร็จ กรุณาเรียกพนักงาน') + ' [' + String(errorKey || 'unknown').slice(0, 40) + ']';
            errorMsg.classList.remove('opacity-0');
            errorMsg.classList.add('opacity-100');
            
            codeBox.classList.add('error', 'shake');
            if (window.showKeypad) window.showKeypad(true);   // let them fix the code straight away
            setTimeout(() => codeBox.classList.remove('shake'), 500);
        }

        function clearError() {
            const errorMsg = document.getElementById('error-msg');
            const codeBox = document.getElementById('code-box');
            errorMsg.classList.remove('opacity-100');
            errorMsg.classList.add('opacity-0');
            codeBox.classList.remove('error');
        }

        let isProcessing = false;

        async function handleRedeem() {
            if (isProcessing) return;
            isProcessing = true;

            const input = document.getElementById('code-input');
            const btn = document.getElementById('redeem-btn');
            const loading = document.getElementById('loading');
            const codeBox = document.getElementById('code-box');
            const code = input.value.toUpperCase().trim();

            // Show loading
            btn.style.display = 'none';   // .btn-modern's inline-flex beats .hidden
            loading.classList.remove('hidden');
            clearError();

            let result;
            try {
                result = await claimPrintPass(code);
            } catch (error) {
                console.error('Print pass claim failed:', error);
                result = { success: false, error: 'network_error' };
            }

            if (!result.success) {
                // Show error
                btn.style.display = '';
                loading.classList.add('hidden');
                showError(result.error);
                isProcessing = false;
                return;
            }

            // Success!
            codeBox.classList.add('success');
            loading.classList.add('hidden');
            triggerFlash();

            btn.style.display = 'none';   // .btn-modern's inline-flex beats .hidden
            input.disabled = true;
            document.getElementById('pass-summary').textContent = printPassMessage(result.pass);
            document.getElementById('pass-ready').classList.remove('hidden');
            document.getElementById('start-btn').focus();
        }
    </script>
</body>
</html>
