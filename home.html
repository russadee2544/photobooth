<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PHOTO BOOTH — Home</title>
    <link rel="stylesheet" href="shared.css">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MEMORIES">
    <meta name="theme-color" content="#0A0A0A">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="manifest" href="/manifest.json">
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen overflow-hidden relative flex flex-col bg-gradient-starter">
    
    <!-- Header -->
    <header class="kiosk-header">
        <div class="kiosk-brand tracking-widest text-sm cursor-pointer select-none" data-i18n="brand" onclick="handleSecretTap()">MEMORIES</div>
        <div class="flex gap-4">
            <button class="lang-btn text-sm transition-colors text-gray-400" data-lang="en" onclick="setLanguage('en')">EN</button>
            <span class="text-gray-300">|</span>
            <button class="lang-btn text-sm transition-colors text-gray-900 font-bold" data-lang="th" onclick="setLanguage('th')">TH</button>
        </div>
    </header>

    <!-- Animated Attract Background -->
    <div class="absolute inset-0 z-0 overflow-hidden opacity-30 pointer-events-none">
        <div class="absolute w-full h-full bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-accent-mint/20 via-transparent to-transparent animate-[pulse_8s_ease-in-out_infinite]"></div>
        <div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-accent-blue/20 blur-[120px] rounded-full animate-[spin_12s_linear_infinite]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-accent-coral/20 blur-[120px] rounded-full animate-[spin_15s_linear_infinite_reverse]"></div>
    </div>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center relative z-10 p-4 sm:p-8" id="main-content">
        <div class="text-center fade-up-enter flex flex-col items-center">
            <h1 class="text-4xl sm:text-6xl md:text-8xl font-black tracking-tighter text-gray-900 mb-4 md:mb-6 drop-shadow-sm uppercase">
                Memories
            </h1>
            <p class="text-base sm:text-xl md:text-2xl mb-8 md:mb-16 tracking-wide font-light max-w-lg mx-auto" data-i18n="home_subtitle">
                Premium digital photo booth experience.
            </p>

            <button onclick="startSession()" class="btn-modern btn-primary text-xl sm:text-2xl px-10 py-5 sm:px-16 sm:py-7 group animate-bounce rounded-full shadow-2xl" data-i18n="home_start">
                Tap to Start
            </button>
        </div>
    </main>

    <!-- Admin PIN Modal (Matches Image 2) -->
    <div id="admin-modal" class="fixed inset-0 bg-gray-200/80 backdrop-blur-md z-[200] flex flex-col items-center justify-center opacity-0 pointer-events-none transition-all duration-300 p-4" onclick="if(event.target===this) hideAdminModal()">
        <div class="bg-white rounded-[28px] shadow-2xl p-8 sm:p-9 max-w-[360px] w-full flex flex-col items-center border border-gray-100/90 relative transform transition-all duration-300 scale-95" id="admin-modal-card">
            
            <!-- Top Lock Icon with Neon Green Accent -->
            <div class="w-14 h-14 bg-gray-950 rounded-2xl flex items-center justify-center mb-4 shadow-md">
                <span class="material-symbols-outlined text-2xl text-accent-mint font-bold" style="font-variation-settings: 'FILL' 1;">lock</span>
            </div>

            <!-- Title & Subtitle -->
            <h2 class="text-2xl font-bold text-gray-900 tracking-tight mb-1.5 text-center">Admin Access</h2>
            <p class="text-xs text-gray-400 text-center mb-6 max-w-[240px] leading-relaxed">กรุณากรอก PIN 4 หลักเพื่อเข้าสู่ระบบควบคุมตู้</p>

            <!-- PIN Input Box with Neon Green border -->
            <div class="relative w-56 h-14 rounded-xl border-2 border-accent-mint bg-white flex items-center justify-center transition-all overflow-hidden cursor-text" id="admin-pin-box" onclick="document.getElementById('admin-pin').focus()">
                <input type="password" id="admin-pin" maxlength="4" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="••••"
                    class="w-full h-full text-center text-gray-900 text-3xl font-mono tracking-[0.45em] bg-transparent border-0 outline-none focus:outline-none focus:ring-0 placeholder:text-gray-300 select-none cursor-text px-2"
                    oninput="handlePinInput(this)" onkeydown="if(event.key==='Enter') submitAdminPin()">
            </div>

            <!-- Error message (if any) -->
            <div id="admin-pin-error" class="text-accent-coral text-xs font-semibold mt-2 min-h-4 text-center opacity-0 transition-opacity"></div>

            <!-- Submit Button -->
            <button onclick="submitAdminPin()" id="btn-admin-submit" class="bg-gray-950 hover:bg-black text-white px-9 py-3.5 rounded-xl font-bold text-sm tracking-wide transition-all shadow-md mt-4 hover:scale-[1.02] active:scale-[0.98]">
                เข้าสู่ระบบ
            </button>
        </div>
    </div>

    <!-- Footer -->
    <footer class="fixed bottom-0 left-0 w-full p-4 sm:p-8 flex justify-between z-50 text-[10px] sm:text-xs font-medium text-gray-400">
        <span id="footer-copyright-status" class="tracking-widest uppercase">© PHOTO BOOTH</span>
        <div class="flex gap-6">
            <a href="#" class="hover:text-gray-900 transition-colors">Privacy</a>
            <a href="#" class="hover:text-gray-900 transition-colors">Terms</a>
        </div>
    </footer>

    <script src="shared.js?v=2.8"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await SessionAsync.clear();
            Session.sessionId = crypto.randomUUID();
            await purgeExpiredFinalAssets();
            new IdleTimer(120000, 'home.html').start();

            document.addEventListener('keydown', (e) => {
                const modal = document.getElementById('admin-modal');
                const isModalOpen = modal && !modal.classList.contains('pointer-events-none');
                if (!isModalOpen) return;

                if (e.key === 'Escape') {
                    hideAdminModal();
                    return;
                }

                const input = document.getElementById('admin-pin');
                if (input && document.activeElement !== input) {
                    if (/^[0-9]$/.test(e.key)) {
                        if (input.value.length < 4) {
                            input.value += e.key;
                            handlePinInput(input);
                        }
                    } else if (e.key === 'Backspace') {
                        input.value = input.value.slice(0, -1);
                        handlePinInput(input);
                    } else if (e.key === 'Enter') {
                        submitAdminPin();
                    }
                }
            });
        });

        function startSession() {
            if (Kiosk.mode === 'event') {
                window.location.href = 'layout.html'; // Skip payment!
            } else {
                window.location.href = 'payment.html';
            }
        }

        // Phase 3: Secret Admin Trigger
        let tapCount = 0;
        let tapTimer = null;
        function handleSecretTap() {
            tapCount++;
            clearTimeout(tapTimer);
            if (tapCount >= 5) {
                tapCount = 0;
                showAdminModal();
            } else {
                tapTimer = setTimeout(() => { tapCount = 0; }, 2000);
            }
        }

        function showAdminModal() {
            const modal = document.getElementById('admin-modal');
            const card = document.getElementById('admin-modal-card');
            const input = document.getElementById('admin-pin');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modal.classList.add('opacity-100', 'pointer-events-auto');
            if (card) {
                card.classList.remove('scale-95');
                card.classList.add('scale-100');
            }
            input.value = '';
            setPinError('');
            input.focus();
            setTimeout(() => input.focus(), 50);
            setTimeout(() => input.focus(), 150);
        }

        function hideAdminModal() {
            const modal = document.getElementById('admin-modal');
            const card = document.getElementById('admin-modal-card');
            modal.classList.remove('opacity-100', 'pointer-events-auto');
            modal.classList.add('opacity-0', 'pointer-events-none');
            if (card) {
                card.classList.remove('scale-100');
                card.classList.add('scale-95');
            }
            setPinError('');
        }

        function handlePinInput(input) {
            const val = input.value.replace(/[^0-9]/g, '').slice(0, 4);
            input.value = val;
            setPinError('');
            if (val.length === 4) {
                setTimeout(() => submitAdminPin(), 150);
            }
        }

        function setPinError(msg) {
            const err = document.getElementById('admin-pin-error');
            if (!err) return;
            if (msg) {
                err.textContent = msg;
                err.classList.remove('opacity-0');
                err.classList.add('opacity-100');
            } else {
                err.textContent = '';
                err.classList.add('opacity-0');
                err.classList.remove('opacity-100');
            }
        }

        async function submitAdminPin() {
            const input = document.getElementById('admin-pin');
            const pin = input.value;
            if (!pin || pin.length < 4) {
                setPinError('กรุณากรอก PIN ให้ครบ 4 หลัก');
                return;
            }
            const btn = document.getElementById('btn-admin-submit');
            if (btn) btn.textContent = 'กำลังตรวจสอบ...';
            const ok = await adminVerifyPin(pin);
            if (btn) btn.textContent = 'เข้าสู่ระบบ';
            if (ok) {
                window.location.href = 'admin.html';
            } else {
                const box = document.getElementById('admin-pin-box');
                if (box) {
                    box.classList.add('border-accent-coral', 'animate-pulse');
                    setTimeout(() => box.classList.remove('border-accent-coral', 'animate-pulse'), 800);
                }
                setPinError('PIN ไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง');
                input.value = '';
                input.focus();
            }
        }
    </script>
</body>
</html>
