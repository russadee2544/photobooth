<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PHOTO BOOTH — Layout</title>
    <link rel="stylesheet" href="shared.css">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MEMORIES">
    <meta name="theme-color" content="#0A0A0A">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="manifest" href="/manifest.json">
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen overflow-y-auto no-scrollbar relative flex flex-col">
    
    <!-- Background Gradients -->
    <div class="absolute inset-0 bg-gradient-starter opacity-30 pointer-events-none"></div>

    <!-- Header -->
    <header class="kiosk-header">
        <button onclick="window.location.href='home.html'" class="flex items-center gap-2 text-gray-500 hover:text-gray-900 transition-colors">
            <span class="material-symbols-outlined">arrow_back</span>
            <span class="font-medium text-sm tracking-wide" data-i18n="btn_back">BACK</span>
        </button>
        <div class="kiosk-brand tracking-widest text-sm" data-i18n="brand">MEMORIES</div>
        <div class="w-20"></div> <!-- spacer -->
    </header>

    <!-- Main Content -->
    <main class="flex-grow pt-28 md:pt-32 pb-36 px-4 sm:px-8 max-w-6xl mx-auto w-full flex flex-col justify-start relative z-10 fade-up-enter">
        <div class="text-center mb-5 md:mb-7">
            <h1 class="text-2xl md:text-4xl font-bold tracking-tight mb-2 uppercase" data-i18n="layout_title">Choose Your Layout</h1>
            <p class="text-gray-500 text-xs md:text-sm" data-i18n="layout_desc">Select a frame style that matches your mood.</p>
        </div>



        <div id="layout-format-summary" class="text-center mb-6"></div>

        <div id="layout-grid" class="layout-standard-grid grid grid-cols-2 sm:grid-cols-3 gap-3 sm:gap-5 max-w-4xl mx-auto w-full">
            <!-- Dynamically populated per active paper mode -->
        </div>
    </main>


    <!-- Bottom Bar -->
    <div class="fixed bottom-0 left-0 w-full p-8 bg-gradient-to-t from-gray-50 via-gray-50/90 to-transparent z-40 flex justify-center">
        <button onclick="window.location.href='capture.html'" class="btn-modern btn-primary text-base px-16 py-4 w-full max-w-sm group" data-i18n="btn_continue">
            Continue 
            <span class="material-symbols-outlined ml-2 text-sm group-hover:translate-x-1 transition-transform">east</span>
        </button>
    </div>

    <script src="template-engine.js?v=1.0"></script>
    <script src="shared.js?v=2.9"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const paperMode = (typeof Kiosk !== 'undefined' && Kiosk.paperMode) ? Kiosk.paperMode : 'photo4x6_dual';
            const wantedType = (typeof Kiosk !== 'undefined' && typeof Kiosk.getTargetTemplateType === 'function')
                ? Kiosk.getTargetTemplateType(paperMode)
                : (paperMode === 'photo4x6_postcard' ? '4x6' : (paperMode.startsWith('thermal') ? paperMode : '2x6'));
            
            const allowedLayoutsList = (typeof Kiosk !== 'undefined' && typeof Kiosk.getAllowedLayouts === 'function')
                ? Kiosk.getAllowedLayouts(paperMode)
                : null;
            const allowedLayoutsSet = allowedLayoutsList ? new Set(allowedLayoutsList) : null;

            let allTemplates = TemplateCatalog.load();
            
            // Filter strictly for the active paper mode!
            let schemas = allTemplates.filter(schema => {
                if (!schema.enabled) return false;
                
                // Match schema.type with wantedType strictly
                let typeMatches = false;
                if (wantedType === '2x6') {
                    typeMatches = schema.type === '2x6';
                } else if (wantedType === '4x6') {
                    typeMatches = schema.type === '4x6';
                } else if (wantedType.startsWith('thermal')) {
                    typeMatches = schema.type === wantedType || (schema.type.startsWith('thermal') && isStandardPhotoCanvas(schema));
                } else if (wantedType === 'photo5x7') {
                    typeMatches = schema.type === 'photo5x7';
                }
                
                if (!typeMatches) return false;

                // Check admin-allowed layouts for this mode
                if (allowedLayoutsSet && !allowedLayoutsSet.has(schema.layoutId)) {
                    return false;
                }

                return true;
            });

            // If no custom or catalog templates match the specific size, generate standard ones for this mode
            if (schemas.length === 0 && window.PhotoTemplateEngine) {
                const stdLayouts = (typeof Kiosk !== 'undefined' && typeof Kiosk.getStandardLayoutsForMode === 'function')
                    ? Kiosk.getStandardLayoutsForMode(paperMode)
                    : [];
                schemas = stdLayouts
                    .filter(l => !allowedLayoutsSet || allowedLayoutsSet.has(l.layoutId))
                    .map(l => PhotoTemplateEngine.createTemplate(l.layoutId, wantedType === '4x6' ? '4x6-portrait' : wantedType));
            }

            // Deduplicate by layoutId and orientation so customer gets clean unique choices
            const seen = new Set();
            const uniqueSchemas = [];
            for (const s of schemas) {
                const key = `${s.layoutId}_${s.orientation || 'portrait'}`;
                if (!seen.has(key)) {
                    seen.add(key);
                    uniqueSchemas.push(s);
                }
            }

            const grid = document.getElementById('layout-grid');
            grid.innerHTML = '';
            uniqueSchemas.forEach(schema => appendLayoutCard(schema));

            // Select default template: prefer 3-frame or first available
            const initialTemplate = uniqueSchemas.find(schema => schema.slots.length === 3 && schema.orientation !== 'landscape') || uniqueSchemas[0];
            if (initialTemplate) selectLayout(initialTemplate.templateId);
            renderFormatSummary(paperMode, initialTemplate);

            new IdleTimer(60000, 'home.html').start();
        });

        function isStandardPhotoCanvas(schema) {
            if (schema.type === '2x6') return schema.canvas.width === 600 && schema.canvas.height === 1800 && schema.canvas.dpi === 300;
            if (schema.type === '4x6') {
                const portrait = schema.canvas.width === 1200 && schema.canvas.height === 1800;
                const landscape = schema.canvas.width === 1800 && schema.canvas.height === 1200;
                return (portrait || landscape) && schema.canvas.dpi === 300;
            }
            if (schema.type === 'photo5x7') return schema.canvas.width === 1500 && schema.canvas.height === 2100;
            if (schema.type === 'thermal58') return schema.canvas.width === 384;
            if (schema.type === 'thermal80') return schema.canvas.width === 576;
            if (schema.type === 'thermal100') return schema.canvas.width === 832;
            return true;
        }

        function appendLayoutCard(schema) {
            const card = document.createElement('button');
            card.type = 'button';
            card.className = 'selection-card layout-standard-card';
            card.dataset.layout = schema.layoutId;
            card.dataset.templateSchemaId = schema.templateId;
            card.title = `${schema.name} · ${schema.canvas.width}×${schema.canvas.height}px · ${schema.canvas.dpi} DPI`;
            card.onclick = () => selectLayout(schema.templateId);

            const preview = document.createElement('div');
            const shapeClass = (schema.type === '2x6' || schema.type.startsWith('thermal'))
                ? 'is-strip'
                : schema.orientation === 'landscape' ? 'is-landscape' : 'is-portrait';
            preview.className = `layout-canvas-preview ${shapeClass}`;
            preview.style.aspectRatio = `${schema.canvas.width} / ${schema.canvas.height}`;
            schema.slots.forEach(slot => {
                const slotPreview = document.createElement('span');
                slotPreview.className = 'layout-slot-preview';
                slotPreview.style.left = `${slot.x / schema.canvas.width * 100}%`;
                slotPreview.style.top = `${slot.y / schema.canvas.height * 100}%`;
                slotPreview.style.width = `${slot.width / schema.canvas.width * 100}%`;
                slotPreview.style.height = `${slot.height / schema.canvas.height * 100}%`;
                slotPreview.style.transform = `rotate(${slot.rotation}deg)`;
                preview.appendChild(slotPreview);
            });
            if (schema.overlay.url) {
                const overlay = document.createElement('img');
                overlay.src = schema.overlay.url;
                overlay.alt = '';
                overlay.className = 'layout-overlay-preview';
                preview.appendChild(overlay);
            }

            const label = document.createElement('div');
            label.className = 'layout-card-label';
            const title = document.createElement('h2');
            title.textContent = schema.templateId.startsWith('custom_') ? schema.name : `${schema.slots.length} รูป`;
            const meta = document.createElement('p');
            const ratio = PhotoTemplateEngine.parseLayout(schema.layoutId).ratio;
            let orientation = 'VERTICAL STRIP';
            if (schema.type === '4x6') orientation = schema.orientation === 'landscape' ? 'LANDSCAPE' : 'PORTRAIT';
            else if (schema.type === 'photo5x7') orientation = 'PHOTO CARD 5x7';
            else if (schema.type.startsWith('thermal')) orientation = schema.slots.length === 4 ? 'THERMAL 2:2' : 'THERMAL STRIP';
            else if (schema.slots.length === 4) orientation = '2:2 GRID';
            const ratioStr = ratio === '3x4' ? '3:4' : ratio === '16x9' ? '16:9' : ratio.toUpperCase();
            meta.textContent = `${ratioStr} · ${orientation}`;
            label.append(title, meta);
            card.append(preview, label);
            document.getElementById('layout-grid').appendChild(card);
        }

        function selectLayout(templateId) {
            const schema = TemplateCatalog.find(templateId);
            if (!schema) return;
            document.querySelectorAll('.selection-card').forEach(card => {
                const selected = card.dataset.templateSchemaId === templateId;
                card.classList.toggle('selected', selected);
                card.setAttribute('aria-pressed', selected ? 'true' : 'false');
            });
            Session.layout = schema.layoutId;
            Session.templateSchemaId = schema.templateId;
            renderFormatSummary(Kiosk.paperMode, schema);
        }

        function renderFormatSummary(paperMode, schema) {
            const summary = document.getElementById('layout-format-summary');
            if (!summary) return;
            const mode = paperMode || 'photo4x6_dual';
            let heading = 'PHOTO STRIP 2×6 นิ้ว';
            let canvas = schema ? `${schema.canvas.width} × ${schema.canvas.height} PX · ${schema.canvas.dpi} DPI` : '—';
            let output = 'พิมพ์แถบเดี่ยว 600 × 1800 PX';

            if (mode === 'photo4x6_dual') {
                heading = 'PHOTO STRIP 2×6 นิ้ว';
                output = 'MULTI-UP 2 แถบ → 1200 × 1800 PX';
            } else if (mode === 'photo4x6_postcard') {
                heading = 'POSTCARD 4×6 นิ้ว';
                output = 'พิมพ์เต็มแผ่น 4×6';
            } else if (mode === 'photo2x6_single') {
                heading = 'PHOTO STRIP 2×6 นิ้ว';
                output = 'พิมพ์แถบเดี่ยว 600 × 1800 PX';
            } else if (mode === 'photo5x7') {
                heading = 'PHOTO CARD 5×7 นิ้ว';
                output = 'พิมพ์การ์ดรูปภาพ 5×7 นิ้ว';
            } else if (mode === 'thermal58') {
                heading = 'THERMAL RECEIPT 58mm';
                output = 'พิมพ์ใบเสร็จความร้อน 58mm (ม้วน)';
            } else if (mode === 'thermal80') {
                heading = 'THERMAL RECEIPT 80mm';
                output = 'พิมพ์ใบเสร็จความร้อน 80mm (ม้วน)';
            } else if (mode === 'thermal100') {
                heading = 'THERMAL RECEIPT 100mm';
                output = 'พิมพ์ใบเสร็จความร้อน 100mm (ม้วน)';
            }

            summary.innerHTML = `<div><strong>${heading}</strong><span>${canvas}</span></div><small>${output}</small>`;
        }
    </script>
</body>
</html>
