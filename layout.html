<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PHOTO BOOTH — Layout</title>
    <link rel="stylesheet" href="shared.css">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MEMORIES">
    <meta name="theme-color" content="#0A0A0A">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="manifest" href="/manifest.json">
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen overflow-y-auto no-scrollbar relative flex flex-col">
    
    <!-- Background Gradients -->
    <div class="absolute inset-0 bg-gradient-starter opacity-30 pointer-events-none"></div>

    <!-- Header -->
    <header class="kiosk-header">
        <button onclick="window.location.href='home.html'" class="flex items-center gap-2 text-gray-500 hover:text-gray-900 transition-colors">
            <span class="material-symbols-outlined">arrow_back</span>
            <span class="font-medium text-sm tracking-wide" data-i18n="btn_back">BACK</span>
        </button>
        <div class="kiosk-brand tracking-widest text-sm" data-i18n="brand">MEMORIES</div>
        <div class="w-20"></div> <!-- spacer -->
    </header>

    <!-- Main Content -->
    <main class="flex-grow pt-28 md:pt-32 pb-36 px-4 sm:px-8 max-w-6xl mx-auto w-full flex flex-col justify-start relative z-10 fade-up-enter">
        <div class="text-center mb-5 md:mb-7">
            <h1 class="text-2xl md:text-4xl font-bold tracking-tight mb-2 uppercase" data-i18n="layout_title">Choose Your Layout</h1>
            <p class="text-gray-500 text-xs md:text-sm" data-i18n="layout_desc">Select a frame style that matches your mood.</p>
        </div>

        <div id="layout-format-summary" class="layout-format-summary max-w-4xl mx-auto w-full mb-4 md:mb-6" aria-live="polite"></div>

        <div id="layout-grid" class="layout-standard-grid grid grid-cols-2 sm:grid-cols-3 gap-3 sm:gap-5 max-w-4xl mx-auto w-full">
            
            <!-- 1-CUT 1:1 -->
            <div class="selection-card p-6 flex flex-col items-center gap-4" data-layout="1_1x1">
                <div class="strip-preview w-32 shadow-sm border border-gray-100 flex-grow flex flex-col justify-center items-center p-2 bg-white rounded-sm">
                    <div class="w-full aspect-square bg-gray-100 rounded-sm"></div>
                </div>
                <div class="text-center">
                    <h2 class="text-sm font-semibold tracking-tight" data-i18n="layout_1">1 Frame</h2>
                    <p class="text-[10px] text-gray-500 mt-1 uppercase tracking-widest">1:1 Square</p>
                </div>
            </div>

            <!-- 2-CUT 1:1 -->
            <div class="selection-card p-6 flex flex-col items-center gap-4" data-layout="2_1x1">
                <div class="strip-preview w-24 shadow-sm border border-gray-100 flex-grow flex flex-col justify-center items-center p-2 bg-white rounded-sm">
                    <div class="w-full flex flex-col gap-1">
                        <div class="w-full aspect-square bg-gray-100 rounded-sm"></div>
                        <div class="w-full aspect-square bg-gray-100 rounded-sm"></div>
                    </div>
                </div>
                <div class="text-center">
                    <h2 class="text-sm font-semibold tracking-tight" data-i18n="layout_2">2 Frames</h2>
                    <p class="text-[10px] text-gray-500 mt-1 uppercase tracking-widest">1:1 Vertical</p>
                </div>
            </div>

            <!-- 3-CUT 1:1 -->
            <div class="selection-card selected p-6 flex flex-col items-center gap-4" data-layout="3_1x1">
                <div class="strip-preview w-20 shadow-sm border border-gray-100 flex-grow flex flex-col justify-center items-center p-2 bg-white rounded-sm">
                    <div class="w-full flex flex-col gap-1">
                        <div class="w-full aspect-square bg-gray-100 rounded-sm"></div>
                        <div class="w-full aspect-square bg-gray-100 rounded-sm"></div>
                        <div class="w-full aspect-square bg-gray-100 rounded-sm"></div>
                    </div>
                </div>
                <div class="text-center">
                    <h2 class="text-sm font-semibold tracking-tight" data-i18n="layout_3">3 Frames</h2>
                    <p class="text-[10px] text-gray-500 mt-1 uppercase tracking-widest">1:1 Vertical</p>
                </div>
            </div>

            <!-- 3-CUT 16:9 -->
            <div class="selection-card p-6 flex flex-col items-center gap-4" data-layout="3_16x9">
                <div class="strip-preview w-28 shadow-sm border border-gray-100 flex-grow flex flex-col justify-center items-center p-2 bg-white rounded-sm">
                    <div class="w-full flex flex-col gap-1">
                        <div class="w-full aspect-video bg-gray-100 rounded-sm"></div>
                        <div class="w-full aspect-video bg-gray-100 rounded-sm"></div>
                        <div class="w-full aspect-video bg-gray-100 rounded-sm"></div>
                    </div>
                </div>
                <div class="text-center">
                    <h2 class="text-sm font-semibold tracking-tight" data-i18n="layout_3">3 Frames</h2>
                    <p class="text-[10px] text-gray-500 mt-1 uppercase tracking-widest">16:9 Vertical</p>
                </div>
            </div>

            <!-- 4-CUT 1:1 -->
            <div class="selection-card p-6 flex flex-col items-center gap-4" data-layout="4_1x1">
                <div class="strip-preview w-32 shadow-sm border border-gray-100 flex-grow flex flex-col justify-center items-center p-2 bg-white rounded-sm">
                    <div class="grid grid-cols-2 gap-1 w-full">
                        <div class="w-full aspect-square bg-gray-100 rounded-sm"></div>
                        <div class="w-full aspect-square bg-gray-100 rounded-sm"></div>
                        <div class="w-full aspect-square bg-gray-100 rounded-sm"></div>
                        <div class="w-full aspect-square bg-gray-100 rounded-sm"></div>
                    </div>
                </div>
                <div class="text-center">
                    <h2 class="text-sm font-semibold tracking-tight" data-i18n="layout_4">4 Frames</h2>
                    <p class="text-[10px] text-gray-500 mt-1 uppercase tracking-widest">1:1 Grid</p>
                </div>
            </div>

            <!-- 4-CUT 16:9 -->
            <div class="selection-card p-6 flex flex-col items-center gap-4" data-layout="4_16x9">
                <div class="strip-preview w-40 shadow-sm border border-gray-100 flex-grow flex flex-col justify-center items-center p-2 bg-white rounded-sm">
                    <div class="grid grid-cols-2 gap-1 w-full">
                        <div class="w-full aspect-video bg-gray-100 rounded-sm"></div>
                        <div class="w-full aspect-video bg-gray-100 rounded-sm"></div>
                        <div class="w-full aspect-video bg-gray-100 rounded-sm"></div>
                        <div class="w-full aspect-video bg-gray-100 rounded-sm"></div>
                    </div>
                </div>
                <div class="text-center">
                    <h2 class="text-sm font-semibold tracking-tight" data-i18n="layout_4">4 Frames</h2>
                    <p class="text-[10px] text-gray-500 mt-1 uppercase tracking-widest">16:9 Grid</p>
                </div>
            </div>

        </div>
    </main>


    <!-- Bottom Bar -->
    <div class="fixed bottom-0 left-0 w-full p-8 bg-gradient-to-t from-gray-50 via-gray-50/90 to-transparent z-40 flex justify-center">
        <button onclick="window.location.href='capture.html'" class="btn-modern btn-primary text-base px-16 py-4 w-full max-w-sm group" data-i18n="btn_continue">
            Continue 
            <span class="material-symbols-outlined ml-2 text-sm group-hover:translate-x-1 transition-transform">east</span>
        </button>
    </div>

    <script src="template-engine.js?v=1.0"></script>
    <script src="shared.js?v=2.9"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const paperMode = Kiosk.paperMode;
            const postcardMode = paperMode === 'photo4x6_postcard';
            const wantedType = postcardMode ? '4x6' : '2x6';
            const allowedPostcardCounts = new Set([1, 3, 4]);
            const allowedPostcardLayouts = new Set(['1_1x1', '3_1x1', '4_1x1']);
            const schemas = TemplateCatalog.load().filter(schema => {
                if (!schema.enabled || schema.type !== wantedType || !isStandardPhotoCanvas(schema)) return false;
                if (schema.templateId.startsWith('custom_')) return true;
                return !postcardMode || (allowedPostcardCounts.has(schema.slots.length) && allowedPostcardLayouts.has(schema.layoutId));
            });

            const uniqueSchemas = Array.from(new Map(schemas.map(schema => [schema.templateId, schema])).values());
            const grid = document.getElementById('layout-grid');
            grid.innerHTML = '';
            uniqueSchemas.forEach(schema => appendLayoutCard(schema));

            const initialTemplate = uniqueSchemas.find(schema => schema.slots.length === 3 && schema.orientation !== 'landscape') || uniqueSchemas[0];
            if (initialTemplate) selectLayout(initialTemplate.templateId);
            renderFormatSummary(paperMode, initialTemplate);

            new IdleTimer(60000, 'home.html').start();
        });

        function isStandardPhotoCanvas(schema) {
            if (schema.type === '2x6') return schema.canvas.width === 600 && schema.canvas.height === 1800 && schema.canvas.dpi === 300;
            const portrait = schema.canvas.width === 1200 && schema.canvas.height === 1800;
            const landscape = schema.canvas.width === 1800 && schema.canvas.height === 1200;
            return (portrait || landscape) && schema.canvas.dpi === 300;
        }

        function appendLayoutCard(schema) {
            const card = document.createElement('button');
            card.type = 'button';
            card.className = 'selection-card layout-standard-card';
            card.dataset.layout = schema.layoutId;
            card.dataset.templateSchemaId = schema.templateId;
            card.title = `${schema.name} · ${schema.canvas.width}×${schema.canvas.height}px · ${schema.canvas.dpi} DPI`;
            card.onclick = () => selectLayout(schema.templateId);

            const preview = document.createElement('div');
            const shapeClass = schema.type === '2x6' ? 'is-strip' : schema.orientation === 'landscape' ? 'is-landscape' : 'is-portrait';
            preview.className = `layout-canvas-preview ${shapeClass}`;
            preview.style.aspectRatio = `${schema.canvas.width} / ${schema.canvas.height}`;
            schema.slots.forEach(slot => {
                const slotPreview = document.createElement('span');
                slotPreview.className = 'layout-slot-preview';
                slotPreview.style.left = `${slot.x / schema.canvas.width * 100}%`;
                slotPreview.style.top = `${slot.y / schema.canvas.height * 100}%`;
                slotPreview.style.width = `${slot.width / schema.canvas.width * 100}%`;
                slotPreview.style.height = `${slot.height / schema.canvas.height * 100}%`;
                slotPreview.style.transform = `rotate(${slot.rotation}deg)`;
                preview.appendChild(slotPreview);
            });
            if (schema.overlay.url) {
                const overlay = document.createElement('img');
                overlay.src = schema.overlay.url;
                overlay.alt = '';
                overlay.className = 'layout-overlay-preview';
                preview.appendChild(overlay);
            }

            const label = document.createElement('div');
            label.className = 'layout-card-label';
            const title = document.createElement('h2');
            title.textContent = schema.templateId.startsWith('custom_') ? schema.name : `${schema.slots.length} รูป`;
            const meta = document.createElement('p');
            const ratio = PhotoTemplateEngine.parseLayout(schema.layoutId).ratio;
            const orientation = schema.type === '2x6' ? 'VERTICAL STRIP' : schema.orientation === 'landscape' ? 'LANDSCAPE' : 'PORTRAIT';
            meta.textContent = `${ratio.toUpperCase()} · ${orientation}`;
            const size = document.createElement('small');
            size.textContent = `${schema.canvas.width} × ${schema.canvas.height} PX · ${schema.canvas.dpi} DPI`;
            label.append(title, meta, size);
            card.append(preview, label);
            document.getElementById('layout-grid').appendChild(card);
        }

        function selectLayout(templateId) {
            const schema = TemplateCatalog.find(templateId);
            if (!schema) return;
            document.querySelectorAll('.selection-card').forEach(card => {
                const selected = card.dataset.templateSchemaId === templateId;
                card.classList.toggle('selected', selected);
                card.setAttribute('aria-pressed', selected ? 'true' : 'false');
            });
            Session.layout = schema.layoutId;
            Session.templateSchemaId = schema.templateId;
            renderFormatSummary(Kiosk.paperMode, schema);
        }

        function renderFormatSummary(paperMode, schema) {
            const summary = document.getElementById('layout-format-summary');
            const isPostcard = schema && schema.type === '4x6';
            const heading = isPostcard ? 'POSTCARD 4×6 นิ้ว' : 'PHOTO STRIP 2×6 นิ้ว';
            const canvas = schema ? `${schema.canvas.width} × ${schema.canvas.height} PX` : '—';
            const output = paperMode === 'photo4x6_dual'
                ? 'MULTI-UP 2 แถบ → 1200 × 1800 PX'
                : isPostcard ? 'พิมพ์เต็มแผ่น 4×6' : 'พิมพ์แถบเดี่ยว 600 × 1800 PX';
            summary.innerHTML = `<div><strong>${heading}</strong><span>${canvas} · 300 DPI</span></div><small>${output}</small>`;
        }
    </script>
</body>
</html>
