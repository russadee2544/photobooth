# A Thai Windows locale gives Java the Buddhist calendar (year 25xx), past the ZIP date limit (2107)
# that APK packaging checks; build with the Gregorian calendar.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
